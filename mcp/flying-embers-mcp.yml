status: published
name: Flying Embers Commerce MCP (UCP)
description: Flying Embers serves a live, unauthenticated Model Context Protocol endpoint on its own domain
  as part of the Universal Commerce Protocol (UCP) shopping service. A tools/list call returns 13 real
  tools with full JSON Schema input contracts covering catalog search and lookup, cart lifecycle, checkout
  lifecycle, and order retrieval. The surface is provided by the Shopify commerce platform but is served
  from www.flyingembers.com, advertised by the merchant's own /llms.txt, /agents.md and /robots.txt, and
  the UCP merchant profile names this merchant explicitly (merchant_name "Flying Embers", merchant_origin
  www.flyingembers.com).
