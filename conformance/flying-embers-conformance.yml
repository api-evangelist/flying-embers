      /.well-known/ucp returns a UCP merchant profile declaring version 2026-04-08 and
      supported_versions [2026-04-08, 2026-01-23], with dev.ucp.shopping services and
      checkout/cart/order/fulfillment/discount/catalog capabilities.
    spec: https://ucp.dev/2026-04-08/specification/overview/
  - id: mcp
    name: Model Context Protocol
    conforms: true
    evidence: >-
      POST /api/ucp/mcp with method tools/list returned HTTP 200 and 13 tools, each with a
      JSON Schema inputSchema.
  - id: jsonrpc-2.0
    conforms: true
    evidence: MCP endpoint speaks JSON-RPC 2.0; responses carry "jsonrpc":"2.0" and the request id.
  - id: json-schema-2020-12
    conforms: true
