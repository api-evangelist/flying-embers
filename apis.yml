- aid: flying-embers-storefront-json
  name: Flying Embers Storefront Product JSON
  description: >-
    Unauthenticated read-only storefront JSON the merchant documents for agents that only
    need to read store data: product and collection JSON, product search, and the sitemap.
    Documented in the merchant's own /llms.txt; robots.txt directs agents to the UCP/MCP
    endpoint for cart and checkout instead.
  humanURL: https://www.flyingembers.com/llms.txt
