aid: flying-embers
name: Flying Embers
description: >-
  Flying Embers is a Ventura, California beverage company founded in 2017 by Bill Moses
  (co-founder of KeVita) that brews USDA-organic hard kombucha, canned cocktails and hard
  seltzers, sold in retail across the United States and direct-to-consumer from
  flyingembers.com. It is not a software vendor and runs no developer program, but its
  Shopify-hosted storefront serves a real, live agent surface from its own domain: a
  Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp, an anonymous
  Model Context Protocol endpoint at /api/ucp/mcp exposing 13 catalog, cart, checkout and
  order tools with full JSON Schema input contracts, a published /llms.txt and /agents.md
  carrying agent operating instructions, and OIDC/OAuth 2.0 discovery documents for
  customer accounts. Payment completion is explicitly gated on contemporaneous human
  approval and on an idempotency key.
