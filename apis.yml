apis:
- aid: flying-embers-commerce-mcp
  name: Flying Embers Commerce API (UCP over MCP)
  description: >-
    Anonymous JSON-RPC 2.0 / Model Context Protocol endpoint implementing the Universal
    Commerce Protocol shopping service (version 2026-04-08). A tools/list call returns 13
    tools with JSON Schema input contracts covering catalog search and lookup, cart
    lifecycle, checkout lifecycle and order retrieval. Every call requires an agent profile
    URI in meta.ucp-agent.profile; complete_checkout additionally requires
    meta.idempotency-key and explicit human approval of payment.
  humanURL: https://www.flyingembers.com/agents.md
  baseURL: https://www.flyingembers.com/api/ucp/mcp
